<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habits</title>
<meta name="theme-color" content="#130B07">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Habits">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="habits-logo-180.png">
<link rel="icon" href="habits-logo-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Barlow+Condensed:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
<style>
/* Layout: eine Spalte. Dunkles Cockpit, Glas-Karten, roter Tacho als Kopfstück */
:root{
  --bg:#130B07; --surface:rgba(255,226,196,.06); --surface2:#241811; --ink:#F4EBE2; --muted:#A59585;
  --accent:#B8916C; --accent2:#5B3A25; --good:#B8916C; --miss:#2E1D14; --line:rgba(255,240,228,.15);
  --font-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter",system-ui,sans-serif;
  --glass:linear-gradient(180deg,rgba(255,248,240,.20),rgba(255,240,228,.08) 45%,rgba(255,236,222,.10));
  --shine:inset 0 1px 0 rgba(255,255,255,.42),inset 0 0 0 .5px rgba(255,255,255,.10),inset 0 -14px 24px -16px rgba(255,255,255,.10),0 14px 34px rgba(0,0,0,.42);
  --glow:0 0 14px rgba(184,145,108,.40);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
body{padding:calc(18px + env(safe-area-inset-top)) 16px calc(56px + env(safe-area-inset-bottom));min-height:100%;
  background:
    radial-gradient(70% 38% at 12% 2%,rgba(176,132,96,.36),transparent 70%),
    radial-gradient(60% 40% at 95% 28%,rgba(120,58,46,.34),transparent 70%),
    radial-gradient(70% 45% at 20% 72%,rgba(96,66,48,.40),transparent 70%),
    radial-gradient(60% 40% at 92% 100%,rgba(160,118,84,.26),transparent 70%),
    var(--bg);
  background-attachment:fixed}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2{margin:0;text-wrap:balance}
h1{font-family:var(--font-display);font-weight:700;font-size:34px;letter-spacing:.06em;text-transform:uppercase;
  background:linear-gradient(180deg,#F8E9D6,#BFA088);-webkit-background-clip:text;background-clip:text;color:transparent}
h1 b{color:var(--accent);-webkit-text-fill-color:var(--accent)}
h2{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav{display:flex;align-items:center;gap:6px}
.nav button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--glass);box-shadow:var(--shine);font-size:20px;line-height:1}
.nav button:disabled{opacity:.3;cursor:default}
.nav .date{min-width:96px;text-align:center;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.card,.tile,.row,.cell{position:relative;overflow:hidden}
.card{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shine);-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6)}
.row,.tile,.nav button,.btn:not(.pri),.stp,.nchip,.minus,.trsel{-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5)}
.card::after,.tile::after,.row::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.16),transparent 30%,transparent 70%,rgba(255,255,255,.06))}
.card::before,.tile::before{content:"";position:absolute;inset:0 0 55% 0;background:linear-gradient(180deg,rgba(255,236,214,.09),transparent);pointer-events:none;border-radius:inherit}
.hero{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:12px}
.gauge{width:100%;max-width:300px;display:block}
.gauge .n{font-family:var(--font-display);font-weight:700;font-size:78px;fill:var(--ink);font-variant-numeric:tabular-nums}
.gauge .o{font-family:var(--font-display);font-weight:600;font-size:22px;fill:var(--muted)}
.gauge .t{stroke:rgba(255,236,214,.2);stroke-width:2;stroke-linecap:round}
.gauge .t.on{stroke:#D9998A}
.gauge .track{stroke:rgba(255,236,214,.08)}
.gauge .arc{stroke:url(#redgrad);filter:drop-shadow(0 0 7px rgba(184,145,108,.8));transition:stroke-dashoffset .35s ease}
.hero .lbl{margin-top:-30px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center}
.hero .lbl.win{color:var(--accent);font-weight:600}
.bar{height:8px;border-radius:99px;background:rgba(255,236,214,.08);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:99px;box-shadow:var(--glow);transition:width .3s}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:12px 4px;text-align:center;box-shadow:var(--shine)}
.tile b{display:block;font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:10px 16px;border-radius:18px;border:1px solid var(--line);background:var(--glass);box-shadow:var(--shine);text-align:left;transition:transform .38s cubic-bezier(.34,1.56,.64,1)}
.row:active{transform:scale(.97);transition-duration:.12s}
.row::before{content:"";position:absolute;inset:0 0 55% 0;background:linear-gradient(180deg,rgba(255,236,214,.08),transparent);pointer-events:none}
.row .box{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,236,214,.28);display:grid;place-items:center;background:rgba(0,0,0,.35);box-shadow:inset 0 2px 4px rgba(0,0,0,.6)}
.row .box svg{width:18px;height:18px;opacity:0;stroke:#fff}
.row[aria-checked="true"]{border-color:rgba(184,145,108,.5)}
.row[aria-checked="true"] .box{background:linear-gradient(180deg,#CFA884,var(--accent2));border-color:transparent;box-shadow:var(--glow),inset 0 1px 0 rgba(255,236,214,.5)}
.row[aria-checked="true"] .box svg{opacity:1}
.row[aria-checked="true"] .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(255,236,214,.3)}
.row .txt{flex:1;font-weight:500;position:relative}
.row small{display:block;color:var(--muted);font-size:12px;font-weight:400}
#list .row[aria-checked="true"]:not(.locked){opacity:.7}
#list .row{transition:transform .38s cubic-bezier(.34,1.56,.64,1),opacity .45s cubic-bezier(.32,.72,0,1)}
.row.locked{opacity:.4;cursor:default;pointer-events:none;filter:saturate(.6)}
.rw.dep{margin-left:26px}
.rw.drop{animation:drop .32s cubic-bezier(.32,.72,0,1) both}
@keyframes drop{from{opacity:0;transform:translateY(-10px) scaleY(.7);transform-origin:top}to{opacity:1;transform:none}}
.tag{position:relative;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 9px;white-space:nowrap}
.sub{display:flex;justify-content:space-between;align-items:baseline}
.gym{display:flex;flex-direction:column;gap:12px}
.gym .cnt{font-family:var(--font-display);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums}
.dots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dots i{display:block;height:8px;border-radius:99px;background:rgba(255,236,214,.08);margin-bottom:5px}
.dots i.on{background:linear-gradient(90deg,var(--accent2),var(--accent));box-shadow:var(--glow)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.heat .wd{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.cell{aspect-ratio:1;border-radius:10px;border:1px solid rgba(255,236,214,.06);background:var(--surface2);padding:0;font-size:11px;color:var(--ink);font-variant-numeric:tabular-nums}
.cell.pre{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.cell.fut{visibility:hidden}
.cell.sel{border-color:#F4EBE2;box-shadow:0 0 0 2px rgba(244,235,226,.45)}
.rates{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.rate{display:grid;grid-template-columns:1fr auto;gap:6px 8px;font-size:14px}
.rate .bar{grid-column:1/-1;height:5px}
.rate b{font-variant-numeric:tabular-nums}
.edit{display:flex;flex-direction:column;gap:8px}
.edit .row{min-height:52px}
.del{position:relative;margin-left:auto;border:1px solid var(--line);background:rgba(255,236,214,.06);border-radius:99px;padding:6px 12px;font-size:12px}
.del.arm{background:linear-gradient(180deg,#CFA884,var(--accent2));color:#fff;border-color:transparent}
.add{display:flex;flex-wrap:wrap;gap:8px}
.add input,.add select{height:46px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.4);color:var(--ink);padding:0 14px;font:inherit}
.add input{flex:1 1 180px}
.btn{position:relative;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--glass);box-shadow:var(--shine);padding:0 18px;font-weight:600}
.btn.pri{background:linear-gradient(180deg,#C49A74,var(--accent2));border-color:transparent;color:#fff;box-shadow:var(--glow),inset 0 1px 0 rgba(255,236,214,.4)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;color:var(--muted);font-size:12px}

.wk-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.wk-head .rng{font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;text-align:center;flex:1}
.wk-head button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--glass);box-shadow:var(--shine);font-size:18px;line-height:1;flex:none}
.wk-head button:disabled{opacity:.3;cursor:default}
.wbars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}
.wcol{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0}
.wcol .pc{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.wcol .trk{width:100%;height:110px;border-radius:12px;background:rgba(255,236,214,.07);box-shadow:inset 0 1px 3px rgba(0,0,0,.6);display:flex;align-items:flex-end;overflow:hidden;border:1px solid transparent}
.wcol .trk i{display:block;width:100%;border-radius:10px;background:linear-gradient(180deg,#CFA884,var(--accent2));box-shadow:var(--glow)}
.wcol.full .trk i{background:linear-gradient(180deg,#F6DFA8,#B8863F);box-shadow:0 0 14px rgba(240,208,138,.45)}
.wcol .dn{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wcol.sel .trk{border-color:#F4EBE2}
.wcol.sel .dn{color:var(--ink);font-weight:600}
.wcol.off .pc{color:var(--muted)}
.wsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.wsum div{text-align:center}
.wsum b{display:block;font-family:var(--font-display);font-weight:700;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.wsum span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.facts{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.fact{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:10px 12px;border-radius:12px;background:rgba(255,236,214,.05);border:1px solid var(--line)}
.fact b{font-variant-numeric:tabular-nums;white-space:nowrap}
.fact.good b{color:#fff}.fact.bad b{color:var(--accent)}
.rev{display:flex;flex-direction:column;gap:12px}
.rev label{display:flex;flex-direction:column;gap:6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rev textarea{min-height:76px;resize:vertical;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.4);color:var(--ink);padding:12px;font:inherit;font-size:15px;letter-spacing:0;text-transform:none}
.rev textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mvs{position:relative;display:flex;flex-direction:column;gap:4px;flex:none}
.mv{width:34px;height:24px;border-radius:8px;border:1px solid var(--line);background:rgba(255,236,214,.07);font-size:11px;line-height:1;padding:0}
.mv:disabled{opacity:.25;cursor:default}
@media (prefers-reduced-motion: reduce){.bar>i,.gauge .arc,.row{transition:none}}

.hero{align-items:stretch;gap:14px;padding-top:18px}
.hero .big{display:flex;align-items:baseline;gap:10px}
.hero .num{font-weight:700;font-size:64px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero .of{font-size:28px;color:var(--muted);font-weight:500}
.hero .hl{margin-left:auto;text-align:right;font-size:13px;color:var(--muted)}
.hero .hl.win{color:#F0D08A;font-weight:600}
.bar.done>i{background:linear-gradient(90deg,#B8863F,#F6DFA8);box-shadow:0 0 14px rgba(240,208,138,.45)}

.tiles{gap:6px}
.tile{padding:8px 4px;border-radius:14px}
.tile b{font-size:17px;line-height:1.15;font-weight:700}
.tile span{font-size:9px;letter-spacing:.05em}
.row .box{position:relative;display:flex;align-items:center;justify-content:center;flex:none}
.row .box svg{width:20px;height:20px;display:block;stroke-width:2.6}
.row .box .cn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--accent)}
.rw{display:flex;gap:8px;align-items:stretch}
.rw .row{flex:1;min-width:0}
.stp{flex:none;display:flex;align-items:center;gap:2px;border-radius:18px;border:1px solid var(--line);background:var(--glass);box-shadow:var(--shine);padding:0 4px}
.stp button{width:30px;align-self:stretch;background:none;border:0;color:var(--accent);font-size:20px;line-height:1}
.rvh{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.rvh h2{margin:0;flex:1}
.rvh .chev{flex:none;color:var(--muted);transition:transform .5s cubic-bezier(.32,.72,0,1)}
#review.open .rvh .chev{transform:rotate(180deg)}
.rvh.up{justify-content:center;margin-top:12px;padding-top:4px}
#review .rvb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s cubic-bezier(.32,.72,0,1)}
#review.open .rvb{grid-template-rows:1fr}
#review .rvin{overflow:hidden;min-height:0;visibility:hidden;transition:visibility 0s .5s}
#review.open .rvin{visibility:visible;transition-delay:0s}
@keyframes chkpop{0%{transform:scale(.82)}55%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes ckdraw{to{stroke-dashoffset:0}}
@keyframes rowglow{0%{box-shadow:var(--shine),0 0 0 0 rgba(184,145,108,.45)}100%{box-shadow:var(--shine),0 0 0 14px rgba(184,145,108,0)}}
@keyframes txtin{from{opacity:.45}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
@keyframes cellin{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes ovfade{from{opacity:0}to{opacity:1}}
@keyframes ovout{to{opacity:0}}
@keyframes sheetin{from{opacity:0;transform:translateY(26px) scale(.94)}to{opacity:1;transform:none}}
@keyframes sheetout{to{opacity:0;transform:translateY(16px) scale(.96)}}
.row.pop .chk{animation:chkpop .5s cubic-bezier(.34,1.56,.64,1)}
.row.pop .txt{animation:txtin .4s ease}
.row.pop[aria-checked="true"]{animation:rowglow .65s ease-out}
.row.pop[aria-checked="true"] .chk .ck{stroke-dasharray:20;stroke-dashoffset:20;animation:ckdraw .34s .1s cubic-bezier(.32,.72,0,1) forwards}
.chk .bg{transition:fill .25s,stroke .25s}
.ov:not([hidden]){animation:ovfade .28s ease both}
.ov:not([hidden]) .sheet{animation:sheetin .55s cubic-bezier(.32,.72,0,1) both}
.ov.out{animation:ovout .2s ease both !important}
.ov.out .sheet{animation:sheetout .2s ease both !important}
.fm.rise{animation:rise .4s cubic-bezier(.32,.72,0,1) both}
.navfx .wbars .trk i,.navfx .vb .col i{transform-origin:bottom;animation:grow .6s cubic-bezier(.32,.72,0,1) both}
.navfx .heat .cell{animation:cellin .45s cubic-bezier(.32,.72,0,1) both}
.navfx .list .rw,.boot .list .rw{animation:rise .5s cubic-bezier(.32,.72,0,1) both;animation-delay:calc(var(--i,0)*35ms)}
.boot main>section,.boot .tiles{animation:rise .6s cubic-bezier(.32,.72,0,1) both}
.boot main>section:nth-child(2){animation-delay:.05s}.boot main>section:nth-child(3){animation-delay:.1s}
.boot main>section:nth-child(n+5){animation-delay:.2s}
.bar>i{transition:width .75s cubic-bezier(.32,.72,0,1)}
.btn,.nav button,.wk-head button,.stp button,.nchip,.sickt,.minus,.heat .cell,.wcol,.ttl{transition:transform .42s cubic-bezier(.34,1.56,.64,1),background-color .25s,box-shadow .25s,opacity .25s,color .25s}
.btn:active,.nav button:active,.wk-head button:active,.stp button:active,.nchip:active,.sickt:active,.minus:active,.heat .cell:active,.wcol:active{transform:scale(.92);transition-duration:.1s}
#review .rvin{opacity:0;transition:visibility 0s .5s,opacity .25s ease}
#review.open .rvin{opacity:1;transition:visibility 0s,opacity .35s .08s ease}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-delay:0s !important;transition-duration:.01ms !important}}
.nm,#hero .num,#hero .pctn,#tiles .tile b,#week .wsum b,.rate b,.mini3 b{font-variant-numeric:tabular-nums}
.pbar{display:block;height:4px;border-radius:99px;background:rgba(255,255,255,.12);margin-top:8px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .7s cubic-bezier(.32,.72,0,1)}
.qrow{display:flex;gap:8px}
.qchip{border-radius:99px;border:1px solid var(--line);background:var(--glass);box-shadow:var(--shine);padding:8px 18px;font-size:14px;font-weight:600;transition:transform .38s cubic-bezier(.34,1.56,.64,1),background-color .25s}
.qchip:active{transform:scale(.94);transition-duration:.1s}
.qchip.on{background:linear-gradient(180deg,#C49A74,#6a4329);color:#fff;border-color:transparent}
.ddw{display:flex;flex-direction:column;gap:5px}
.ddl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ddb{display:flex;align-items:center;justify-content:space-between;height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.4);color:var(--ink);padding:0 12px;font-size:15px}
.ddb svg{transition:transform .4s cubic-bezier(.32,.72,0,1);color:var(--muted)}
.ddb[aria-expanded="true"] svg{transform:rotate(180deg)}
.ddp{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.32,.72,0,1)}
.ddp.open{grid-template-rows:1fr}
.ddi{overflow:hidden;min-height:0;display:flex;flex-direction:column;gap:2px}
.ddo{display:flex;align-items:center;gap:12px;text-align:left;border:0;background:transparent;padding:10px 6px;border-radius:10px;font-size:15px}
.ddo:active{background:rgba(255,255,255,.08)}
.ddc{width:20px;height:20px;border-radius:6px;border:1.5px solid rgba(255,240,228,.4);flex:none;position:relative;transition:background .25s,border-color .25s}
.ddo.on .ddc{background:linear-gradient(180deg,#D4AE8C,#8a5a3a);border-color:transparent}
.ddo.on .ddc::after{content:"";position:absolute;left:6px;top:2.5px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(40deg)}
.ddo.rep{margin-top:2px;font-size:14px;color:var(--muted)}
.ddo.rep.on{color:var(--ink)}
.rcol{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.sickt{position:relative;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 9px;white-space:nowrap;cursor:pointer}
.sickt.on{color:#fff;background:linear-gradient(180deg,#b5654e,#7b3a2a);border-color:transparent}

<script src="config.js"></script>
<script>
const DEFAULTS = [
  {id:"sleep23", label:"Spätestens 23 Uhr im Bett", days:"wd", type:"daily"},
  {id:"wake10",  label:"Spätestens 10 Uhr aufgestanden", days:"we", type:"daily"},
  {id:"screen",  label:"Max. 3 Std YouTube & Co.", days:"wd", type:"daily"},
  {id:"gym",     label:"Gym", days:"all", type:"weekly", target:6},
  {id:"overload",label:"Progressive Overload geschafft", days:"all", type:"daily", requires:"gym"},
  {id:"training",label:"Training getrackt", days:"all", type:"daily", requires:"gym"},
  {id:"sleep",   label:"7 bis 8 Std Schlaf", days:"all", type:"daily", num:{thr:7, step:0.5, unit:"Std"}},
  {id:"water",   label:"Nur Wasser (und Kaffee)", days:"all", type:"daily"},
  {id:"macros",  label:"Macros getrackt", days:"all", type:"daily"},
  {id:"alcohol", label:"Kein Alkohol", days:"all", type:"daily"}
];
const EXTRA = [
  {id:"nophone", label:"Erste Stunde kein Handy", days:"all", type:"daily"},
  {id:"video",   label:"Video gepostet", days:"all", type:"daily"},
  {id:"creatine",label:"Kreatin genommen", days:"all", type:"daily"}
];
function migrate(){
  state.migr = state.migr || [];
  if(!state.migr.includes("gym6")){
    state.migr.push("gym6");
    const g = state.habits.find(h=>h.id==="gym");
    if(g && (g.target||5)===5) g.target = 6;
  }
  if(!state.migr.includes("sleepnum")){
    state.migr.push("sleepnum");
    const sl = state.habits.find(h=>h.id==="sleep");
    if(sl && !sl.num) sl.num = {thr:7, step:0.5, unit:"Std"};
  }
  state.num = state.num || {}; state.tr = state.tr || {}; state.sick = state.sick || {}; state.nf = state.nf || {}; state.carry = state.carry || {};
  if(!state.migr.includes("training")){
    state.migr.push("training");
    if(!state.habits.some(x=>x.id==="training")){
      let i = state.habits.findIndex(x=>x.id==="overload"); if(i<0) i = state.habits.findIndex(x=>x.id==="gym");
      const nh = {id:"training",label:"Training getrackt",days:"all",type:"daily",requires:"gym"};
      if(i>=0) state.habits.splice(i+1,0,nh); else state.habits.push(nh);
    }
  }
  EXTRA.forEach(h=>{
    if(!state.migr.includes(h.id)){
      state.migr.push(h.id);
      if(!state.habits.some(x=>x.id===h.id)) state.habits.push(Object.assign({},h));
    }
  });
}
const pad = n => String(n).padStart(2,"0");
const key = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = k => { const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (k,n) => { const d=parse(k); d.setDate(d.getDate()+n); return key(d); };
const todayKey = () => key(new Date());
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mondayOf = k => { const d=parse(k); const w=(d.getDay()+6)%7; d.setDate(d.getDate()-w); return key(d); };

let ready = false;
let hmMonth = todayKey().slice(0,7);
function minMonth(){ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-24); return d.getFullYear()+"-"+pad(d.getMonth()+1); }
let state = null, sel = todayKey(), editing = false, armed = null, ref = null, saveTimer = null;
const LS = "lockin-tracker-v1";

function fresh(){ return {v:1, start:todayKey(), habits:JSON.parse(JSON.stringify(DEFAULTS)), log:{}, updated:0}; }
function loadLocal(){
  try{ const s = localStorage.getItem(LS); if(s){ const o=JSON.parse(s); if(o && o.habits) return o; } }catch(e){}
  return null;
}
function persist(){
  state.updated = Date.now();
  try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){}
  clearTimeout(saveTimer);
  setSync("Speichert…");
  saveTimer = setTimeout(pushRemote, 150);
}
function flush(){ if(saveTimer){ clearTimeout(saveTimer); pushRemote(); } }
document.addEventListener("visibilitychange", ()=>{ if(document.hidden) flush(); else if(session && ready) syncDown().then(()=>{ syncMsg="Synchronisiert"; }).catch(()=>{ syncMsg="Offline"; }); });
window.addEventListener("pagehide", flush);
function setSync(t){ syncMsg = t; }

/* ---------- Konto & Cloud (Supabase) ---------- */
const CFG = window.LOCKIN_CONFIG || {};
const cloudOn = !!(CFG.url && CFG.key);
const SES = "lockin-session-v1";
let session = null, syncMsg = cloudOn ? "Nicht angemeldet" : "Nur auf diesem Gerät";
const enc8 = new TextEncoder(), dec8 = new TextDecoder();
function b64(u8){ let s=""; for(let i=0;i<u8.length;i++) s+=String.fromCharCode(u8[i]); return btoa(s); }
function unb64(t){ const s=atob(t), u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; }
function hex(u8){ return Array.from(u8).map(b=>b.toString(16).padStart(2,"0")).join(""); }
async function deriveKeys(name, pin){
  const base = await crypto.subtle.importKey("raw", enc8.encode(name.trim().toLowerCase()+":"+pin), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", salt:enc8.encode("habits-web-v1"), iterations:200000, hash:"SHA-256"}, base, 512));
  return {id:hex(bits.slice(0,32)), key:b64(bits.slice(32))};
}
const aesKey = raw => crypto.subtle.importKey("raw", unb64(raw), "AES-GCM", false, ["encrypt","decrypt"]);
async function encObj(obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv}, await aesKey(session.key), enc8.encode(JSON.stringify(obj))));
  const all = new Uint8Array(12+ct.length); all.set(iv); all.set(ct,12); return b64(all);
}
async function decObj(str){
  const all = unb64(str);
  return JSON.parse(dec8.decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:all.slice(0,12)}, await aesKey(session.key), all.slice(12))));
}
async function rpc(fn, body){
  const r = await fetch(CFG.url.replace(/\/$/,"")+"/rest/v1/rpc/"+fn, {method:"POST", headers:Object.assign({"apikey":CFG.key, "Content-Type":"application/json"}, CFG.key.indexOf("eyJ")===0 ? {"Authorization":"Bearer "+CFG.key} : {}), body:JSON.stringify(body)});
  if(!r.ok) throw new Error("http "+r.status);
  const t = await r.text(); return t ? JSON.parse(t) : null;
}
async function pull(){ const rows = await rpc("get_habits", {p_id:session.id}); return (rows && rows[0]) || null; }
async function pushRemote(){
  saveTimer = null;
  if(!cloudOn || !session) return;
  try{
    const data = await encObj(state);
    await rpc("put_habits", {p_id:session.id, p_data:data, p_updated:Math.max(1,state.updated||0)});
    syncMsg = "Synchronisiert";
  }catch(e){ syncMsg = "Offline, wird beim nächsten Speichern gesendet"; }
}
async function syncDown(){
  const row = await pull(); if(!row) return;
  const remote = await decObj(row.data);
  if((remote.updated||0) > (state.updated||0)){
    state = remote; migrate();
    try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){}
    render();
  }else if((remote.updated||0) < (state.updated||0)){ pushRemote(); }
}
function loginHtml(msg, step){
  const reg = step==="register";
  return '<h2 id="login-t">'+(reg?'Konto erstellen':'Anmelden')+'</h2><div class="fm">'+
    '<label>Name<input id="lg-name" type="text" autocomplete="username" autocapitalize="none" maxlength="40"></label>'+
    '<label>Code (4 Ziffern)<input id="lg-pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="'+(reg?'new-password':'current-password')+'"></label>'+
    (msg ? '<p style="margin:0;color:#CFA884;font-size:14px">'+esc(msg)+'</p>' : '<p style="margin:0;color:var(--muted);font-size:13px">'+(reg?'Wähle einen Namen und einen 4-stelligen Code. Deine bisherigen Daten werden übernommen.':'Gleicher Name und Code auf jedem Gerät, gleiche Daten.')+'</p>')+
    '<button class="btn pri" data-'+(reg?'lcreate':'login')+'="1">'+(reg?'Konto erstellen':'Anmelden')+'</button>'+
    '<button class="lnk" data-lswitch="'+(reg?'login':'register')+'">'+(reg?'Schon ein Konto? Anmelden':'Noch kein Konto?')+'</button></div>';
}
function showLogin(msg, step){
  document.getElementById("loginbody").innerHTML = loginHtml(msg, step);
  document.getElementById("login").hidden = false;
  document.body.style.overflow = "hidden";
  if(!msg) setTimeout(()=>{ const i=document.getElementById("lg-name"); if(i) i.focus(); }, 40);
}
function hideLogin(){ closeOv(document.getElementById("login"), ()=>{ document.body.style.overflow = ""; }); }
function readCreds(step){
  const name = document.getElementById("lg-name").value.trim(), pin = document.getElementById("lg-pin").value.trim();
  if(!name){ showLogin("Bitte Namen eingeben.", step); return null; }
  if(!/^\d{4}$/.test(pin)){ showLogin("Der Code besteht aus genau 4 Ziffern.", step); return null; }
  return {name,pin};
}
async function doLogin(){
  const c = readCreds(); if(!c) return;
  document.getElementById("loginbody").innerHTML = '<h2>Anmelden</h2><p style="color:var(--muted)">Einen Moment …</p>';
  try{
    const k = await deriveKeys(c.name, c.pin);
    session = {name:c.name, id:k.id, key:k.key};
    const row = await pull();
    if(!row){ session = null; showLogin("Kein Konto mit diesem Namen und Code. Vertippt? Sonst unten „Noch kein Konto?“ antippen."); return; }
    const remote = await decObj(row.data);
    localStorage.setItem(SES, JSON.stringify(session));
    if((remote.updated||0) >= (state.updated||0)){ state = remote; migrate(); try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){} }
    else pushRemote();
    syncMsg = "Synchronisiert"; ready = true; hideLogin(); render();
  }catch(e){ session = null; showLogin("Keine Verbindung oder falsche Einstellungen. Bitte erneut versuchen."); }
}
async function doCreate(){
  const c = readCreds("register"); if(!c) return;
  document.getElementById("loginbody").innerHTML = '<h2>Konto erstellen</h2><p style="color:var(--muted)">Einen Moment …</p>';
  try{
    const k = await deriveKeys(c.name, c.pin);
    session = {name:c.name, id:k.id, key:k.key};
    const row = await pull();
    if(row){ session = null; showLogin("Dieses Konto gibt es schon. Bitte unten auf „Schon ein Konto?“ tippen und anmelden.", "register"); return; }
    localStorage.setItem(SES, JSON.stringify(session));
    state.updated = Math.max(1, state.updated||0);
    await pushRemote();
    ready = true; hideLogin(); render();

function dayMatch(h,k){
  if(h.learn){
    if(state.carry && (state.carry[k]||[]).includes(h.id)) return true;
    if(h.dates) return h.dates.includes(k);
    if(h.wdays) return k>=(h.from||"0000") && h.wdays.includes(parse(k).getDay());
    return false;
  }
  const d=parse(k).getDay(), we = d===0||d===6;
  return h.days==="all" || (h.days==="we" && we) || (h.days==="wd" && !we);
}
function dayInfo(k){
  const done = new Set(state.log[k]||[]);
  const active = state.habits.filter(h=>dayMatch(h,k) && weekActive(h,k) && !(canSick(h) && isSick(h.id,k)) && !(h.learn && isNF(h.id,k)) && (!h.requires || done.has(h.requires)));
  const n = active.filter(h=>done.has(h.id)).length;

}
function range(fromK, toK){ const out=[]; for(let k=fromK;k<=toK;k=addDays(k,1)) out.push(k); return out; }
function avg(days){
  const t = todayKey(), from = addDays(t,-(days-1));
  const ks = range(from < state.start ? state.start : from, t).filter(k=>dayInfo(k).total>0);
  if(!ks.length) return null;
  return Math.round(100*ks.reduce((a,k)=>a+dayInfo(k).pct,0)/ks.length);
}
function streak(){
  const t = todayKey();

  while(k >= state.start && dayInfo(k).full){ n++; k = addDays(k,-1); }

}
function perfect(){ return range(state.start, todayKey()).filter(k=>dayInfo(k).full).length; }
function weekActive(h,k){

  const a = h.anchor || mondayOf(state.start);

function weekDone(id,k){

}
function timesTotal(id){

  ds.forEach(d=>{ const c=state.cnt&&state.cnt[d]&&state.cnt[d][id]; if(c!=null) t+=c; else if((state.log[d]||[]).includes(id)) t++; });

}
function setDone(id,on){ const arr=new Set(state.log[sel]||[]); on?arr.add(id):arr.delete(id); if(arr.size) state.log[sel]=[...arr]; else delete state.log[sel]; }

function setCnt(id,n){ state.cnt=state.cnt||{}; const c=state.cnt[sel]=state.cnt[sel]||{}; if(n>0) c[id]=n; else delete c[id]; if(!Object.keys(c).length) delete state.cnt[sel]; }
const canSick = h => !!h && h.type==='weekly' && (h.id==='gym' || h.sick===true || /gym|training|sport|lauf|workout|fitness/i.test(h.label||''));

function fmtHM(m){ m=Math.round(m); return Math.floor(m/60)+":"+pad(m%60); }

function bez(x1,y1,x2,y2){
  const cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx,cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;
  const X=t=>((ax*t+bx)*t+cx)*t, Y=t=>((ay*t+by)*t+cy)*t;
  return x=>{ let t=x; for(let i=0;i<8;i++){ const e=X(t)-x; if(Math.abs(e)<1e-5) break; const d=(3*ax*t+2*bx)*t+cx; if(Math.abs(d)<1e-6) break; t-=e/d; } return Y(Math.min(1,Math.max(0,t))); };
}
const appleEase = bez(.32,.72,0,1);
window.__nums = window.__nums || {};
const NUMSEL = ['#hero .num','#hero .pctn','#tiles .tile b','#week .wsum b','#rates .rate b','.mini3 b'];
function animNums(){
  NUMSEL.forEach(sel=>{
    document.querySelectorAll(sel).forEach((el,i)=>{
      const lab = el.closest('.rate') ? (el.parentNode.querySelector('span')||{}).textContent : '';
      const key = sel+'|'+(el.closest('.mini3') ? (el.parentNode.parentNode.parentNode.id||'')+i : i)+'|'+lab;
      const m = /^(-?\d+(?:,\d+)?)(.*)$/.exec(el.textContent.trim());
      if(!m){ delete window.__nums[key]; return; }
      const dec = m[1].indexOf(',')>=0 ? m[1].split(',')[1].length : 0, suf = m[2];
      const to = parseFloat(m[1].replace(',','.')), prev = window.__nums[key];
      window.__nums[key] = to;
      if(prev==null || prev===to) return;
      const t0 = performance.now(), D = 700, tok = (el.__tok = (el.__tok||0)+1);
      const fmt = v => (dec ? v.toFixed(dec).replace('.',',') : String(Math.round(v)))+suf;
      el.textContent = fmt(prev);
      (function f(t){
        if(el.__tok!==tok) return;
        const k = Math.min(1,(t-t0)/D), v = prev+(to-prev)*appleEase(k);
        window.__nums[key] = v; el.textContent = fmt(v);
        if(k<1) requestAnimationFrame(f); else { window.__nums[key]=to; el.textContent = fmt(to); }
      })(t0);

function habitStreak(h){
  const t=todayKey(), L=state.log;
  if(h.type==="weekly"){
    const MIN=3, cm=mondayOf(t); let run=0,best=0;
    for(let k=mondayOf(state.start); k<=cm; k=addDays(k,7)){

      lines.push(l);
    }else lines.push('Gesamt: Trend '+f1(sp.m)+' Punkte pro Woche. Wenn es so weitergeht, liegst du in 4 Wochen bei etwa Ø '+inFour+' %.');
  }
  const gw=gymWeeks(8).filter(w=>w.valid && !w.cur && !w.sk).map(w=>w.c);
  if(g && gw.length>=3 && gw.some(c=>c>0)){
    const sp=slope(gw), last=gw.length-1, m4=gw.slice(-4).reduce((a,b)=>a+b,0)/Math.min(4,gw.length);
    const nx=Math.max(0,Math.min(7,Math.round(sp.at(last+1))));
    lines.push('Gym: Ø '+f1(m4)+' Einheiten pro Woche, Trend '+(sp.m>=0.3?'steigend':sp.m<=-0.3?'fallend':'stabil')+'. Nächste Woche voraussichtlich etwa '+nx+'.');
  }
  if(!lines.length){ fc.innerHTML='<h2>Prognose</h2><div class="fc"><p>Kommt nach etwa 3 Wochen mit Daten.</p></div>'; }
  else fc.innerHTML='<h2>Prognose</h2><div class="fc">'+lines.map(l=>'<p>'+esc(l)+'</p>').join("")+'<small>Schätzung aus dem Trend der letzten Wochen, keine Garantie.</small></div>';
}

  if(t.dataset.rep){ const nh=window.__nh; nh.rep=!nh.rep; t.classList.toggle("on",nh.rep); t.setAttribute("aria-pressed",nh.rep); return; }

  if(e.key==="Escape" && !document.getElementById("modal").hidden) closeNew();
  if(e.key==="Enter" && e.target.id==="nh-label") saveNew();
  if(e.key==="Enter" && (e.target.id==="lg-pin" || e.target.id==="lg-name")) doLogin();
});
let drag = null;
document.addEventListener("pointerdown", e=>{
  const g = e.target.closest && e.target.closest(".grip"); if(!g) return;
  const row = g.closest(".row[data-hid]"); if(!row) return;
  e.preventDefault();
  const r = row.getBoundingClientRect();
  drag = {row, grab:e.clientY - r.top, pid:e.pointerId, grip:g};
  row.classList.add("dragging");
  try{ g.setPointerCapture(e.pointerId); }catch(_){}
});
document.addEventListener("pointermove", e=>{
  if(!drag || e.pointerId!==drag.pid) return;
  e.preventDefault();
  const y = e.clientY, row = drag.row;
  row.style.transform = "none";
  const rows = [...document.querySelectorAll("#edit .row[data-hid]")], i = rows.indexOf(row);
  const nat = row.getBoundingClientRect(), cy = y - drag.grab + nat.height/2;
  const nx = rows[i+1], pv = rows[i-1];
  if(nx){ const q = nx.getBoundingClientRect(); if(cy > q.top + q.height/2) nx.after(row); }
  if(pv){ const q = pv.getBoundingClientRect(); if(cy < q.top + q.height/2) pv.before(row); }
  const top = row.getBoundingClientRect().top;
  row.style.transform = "translateY("+(y - drag.grab - top)+"px)";
}, {passive:false});
function endDrag(e){
  if(!drag || (e && e.pointerId!==drag.pid)) return;
  const order = [...document.querySelectorAll("#edit .row[data-hid]")].map(r=>r.dataset.hid);
  drag = null;
  const map = new Map(state.habits.map(h=>[h.id,h]));
  const next = order.map(id=>map.get(id)).filter(Boolean);
  if(next.length===state.habits.length && next.some((h,i)=>h!==state.habits[i])){ state.habits = next; persist(); }
  render();
}
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", endDrag);
state = loadLocal() || fresh();
if(!state.start) state.start = todayKey();
migrate();
render();
document.body.classList.add('boot'); setTimeout(()=>document.body.classList.remove('boot'),1400);
initRemote();
// Neuer Tag während die Seite offen bleibt
let lastDay = todayKey();
setInterval(()=>{ const t=todayKey(); if(t!==lastDay){ if(sel===lastDay) sel=t; lastDay=t; render(); } }, 60000);
</script>
